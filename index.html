<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ショップ運営シミュレーター Ver.1</title>
<style>
:root{
  --cell-h:42px;--time-w:70px;--lane-w:122px;--grid:#cfd3d7;--head:#eef2f7;--excel:#217346;
  --white:#fff;--yellow:#ffe680;--orange:#ffb347;--gray:#bfc3c7;--red:#ef6a6a;--green:#81c784;--blue:#72a9e6;--pink:#f4a6c1;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#1f2937}
header{position:sticky;top:0;z-index:40;background:var(--excel);color:#fff;padding:10px}
.toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{font-size:26px;font-weight:800;min-width:78px}
button,select{border:1px solid #c7ccd1;background:#fff;border-radius:8px;padding:8px 10px;font-size:14px;min-height:38px}
button.primary{background:#0f5132;color:#fff;border-color:#0f5132}
.summarybar{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px;padding:8px;background:#fff;border-bottom:1px solid #d7dbe0}
.targetTop{
  position:sticky;top:62px;z-index:34;background:#fffdf5;
  border-bottom:1px solid #d7dbe0;padding:8px 10px;
}
.targetTitle{font-weight:800;font-size:14px;margin-bottom:6px}
.targetTop .pill{
  background:#fff;border:2px solid #d9d9d9;font-size:13px;padding:7px 10px;
}

.metric{background:#f8fafc;border:1px solid #dce1e6;border-radius:8px;padding:6px 8px;font-size:12px}
.metric b{display:block;font-size:16px}
.staffstrip{display:flex;gap:8px;overflow-x:auto;padding:8px;background:#f7f9fb;border-bottom:1px solid #d7dbe0}
.staffcard{min-width:205px;background:#fff;border:1px solid #d7dbe0;border-radius:9px;padding:7px;font-size:12px}
.name{font-weight:800;font-size:14px}
.badge{display:inline-block;padding:2px 6px;border-radius:999px;background:#e9eef5;margin:2px 2px 0 0}
.role{background:#fff2c7}.stable{background:#dff3e5}.normal{background:#e7eefc}.risky{background:#fde2e2}
#boardWrap{overflow:auto;height:58vh;background:#fff;border-bottom:1px solid #d7dbe0;touch-action:pan-x pan-y;min-width:0}
.desktopLayout{display:block}
.sideEvent{display:block}

table{border-collapse:collapse;min-width:max-content}
th,td{border:1px solid var(--grid);height:var(--cell-h);min-width:var(--lane-w);position:relative}
th{background:var(--head);position:sticky;top:0;z-index:10;font-size:13px}
th.time,td.time{min-width:var(--time-w);width:var(--time-w);background:#fafafa;position:sticky;left:0;z-index:12;text-align:center;font-size:12px}
.currentRow td{box-shadow:inset 0 2px 0 #1d4ed8,inset 0 -2px 0 #1d4ed8}
.block{position:absolute;left:2px;right:2px;top:2px;border:1px solid #7b8085;border-radius:5px;padding:4px 5px;font-size:11px;line-height:1.25;overflow:hidden;z-index:4;user-select:none;-webkit-user-select:none;touch-action:none}
.block .title{font-weight:800}.block .sub{font-size:10px;opacity:.8}
.resizeHandle{
  position:absolute;left:0;right:0;bottom:0;height:12px;
  background:rgba(0,0,0,.08);border-top:1px dashed rgba(0,0,0,.35);
  cursor:ns-resize;touch-action:none;text-align:center;font-size:10px;line-height:11px;
}
.resizeHandle::after{content:"↕";opacity:.65}

.st-white{background:var(--white)}.st-yellow{background:var(--yellow)}.st-orange{background:var(--orange)}.st-gray{background:var(--gray)}.st-red{background:var(--red)}.st-green{background:var(--green)}.st-blue{background:var(--blue)}.st-pink{background:var(--pink)}
.dragghost{opacity:.65}
.panel{background:#fff;margin:8px;border:1px solid #d7dbe0;border-radius:10px;padding:10px}
.panel h3{margin:0 0 8px;font-size:15px}
.flex{display:flex;gap:7px;flex-wrap:wrap}
.pill{border:1px solid #ccd2d8;background:#f8fafc;border-radius:999px;padding:5px 8px;font-size:12px}
#eventLog{
  height:calc(100vh - 210px);min-height:420px;overflow-y:auto;overflow-x:hidden;
  font-size:17px;background:#f8fafc;color:#1f2937;
  padding:10px;border-radius:8px;border:1px solid #d7dbe0;
  scroll-behavior:smooth;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.eventHeader{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.eventHeader h3{margin:0}
.logrow{
  margin-bottom:9px;padding:10px 11px;border-radius:8px;background:#fff;
  border-left:6px solid #94a3b8;box-shadow:0 1px 2px rgba(0,0,0,.04);
  line-height:1.5;font-weight:600;
}
.logrow.alert{color:#7a4b00;border-left-color:#f59e0b;background:#fff8e7}
.logrow.good{color:#14532d;border-left-color:#22c55e;background:#effcf3}
.logrow.bad{color:#7f1d1d;border-left-color:#ef4444;background:#fff1f1}
.logrow.arrival{color:#6b4f00;border-left-color:#eab308;background:#fffbea}
.logrow.cancel{color:#7f1d1d;border-left-color:#dc2626;background:#fff1f2}
.logrow.info{color:#1e3a8a;border-left-color:#3b82f6;background:#eff6ff}

.modalBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:min(680px,100%);max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}
.modal h3{margin:0 0 8px}.modal .close{float:right}
.actionGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actionGrid button{width:100%}
.small{font-size:11px;color:#6b7280}
@media(min-width:900px){
  .modalBackdrop{align-items:center}.modal{border-radius:14px}
  .desktopLayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:8px;padding:8px}
  #boardWrap{height:68vh;border:1px solid #d7dbe0;border-radius:10px}
  .sideEvent{margin:0;height:68vh;display:flex;flex-direction:column}
  .sideEvent #eventLog{max-height:none;height:100%;flex:1}
}
@media(max-width:899px){
  .sideEvent{margin:8px}
  .targetTop{top:104px}
  #eventLog{height:360px;min-height:360px;font-size:17px}
}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="clock" id="clock">10:00</div>
    <button id="startBtn" class="primary">▶ 開始</button>
    <button id="pauseBtn">⏸ 停止</button>
    <select id="speedSel">
      <option value="60">ゆっくり（60秒=15分）</option>
      <option value="45" selected>標準（45秒=15分）</option>
      <option value="30">速い（30秒=15分）</option>
    </select>
    <select id="dayModeSel">
      <option value="weekday" selected>平日</option>
      <option value="holiday">休日</option>
    </select>
    <button id="resetBtn">↺ リセット</button>
  </div>
</header>

<div class="summarybar">
  <div class="metric">総合スコア<b id="score">0</b></div>
  <div class="metric">リアルタイム管理<b id="rtScore">100</b></div>
  <div class="metric">実績pt<b id="salesScore">0</b></div>
  <div class="metric">上司指摘<b id="bossCount">0</b></div>
</div>

<div class="targetTop">
  <div class="targetTitle">本日の目標 / 実績</div>
  <div class="flex" id="targetBoard"></div>
</div>

<div id="staffStrip" class="staffstrip"></div>

<div class="desktopLayout">
  <div id="boardWrap"><table id="grid"></table></div>
  <div class="sideEvent panel">
    <div class="eventHeader">
      <h3>イベントログ</h3>
      <div class="flex">
        <button type="button" onclick="document.getElementById('eventLog').scrollTo({top:0,behavior:'smooth'})">最新へ</button>
        <button type="button" onclick="document.getElementById('eventLog').scrollTo({top:document.getElementById('eventLog').scrollHeight,behavior:'smooth'})">最初へ</button>
      </div>
    </div>
    <div id="eventLog"></div>
  </div>
</div>

<div class="panel">
  <h3>操作</h3>
  <div class="flex">
    <span class="pill">Windows：ブロックをドラッグ</span>
    <span class="pill">iPhone：ブロックを約0.45秒長押し→移動</span>
    <span class="pill">タップ：状態変更・相談・30分前確認</span>
    <span class="pill">初期予約：平日 約55〜60%／休日 約60〜65%</span>
    <span class="pill">10:00は通常スタッフ1名を10:30まで空ける</span>
    <span class="pill">当日客：1日複数回必ず発生・1〜3名同時来店あり</span>
    <span class="pill">当日客：15分カード→内容確認1分→必要時間で配置</span>
    <span class="pill">休憩60分は開始前に配置済み</span>
    <span class="pill">30分枠は件数ベース約15%以下</span>
  </div>
</div>

<div class="modalBackdrop" id="modalBackdrop">
  <div class="modal">
    <button class="close" id="modalClose">閉じる</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const START=600,END=1140,CELL_H=42;
let dayMode="weekday";
let lanes=[];

function buildLanes(){
  if(dayMode==="weekday"){
    lanes=["スタッフA","スタッフB","スタッフC","新人1","新人2","リーダー","ヘルパー","登録待ち","当日","副店長","店長","予備"];
  }else{
    lanes=["スタッフA","スタッフB","スタッフC","スタッフD","スタッフE","新人1","新人2","リーダー","ヘルパー","登録待ち","当日","副店長","店長","予備"];
  }
}
const procedures={"PI":90,"新規":90,"機種変更":90,"故障":60,"プラン相談":60,"光相談":60,"その他":60,"操作":30,"簡易":30,"支払い":15,"他店在庫受取":45,"休憩":60};
const salesValues={"PLATINUM":100,"光":100,"GOLD":60,"機種変更化":60,"でんき・ガス":30,"アフィリエイト":30};
const salesKeys=Object.keys(salesValues);

let staff={};

function proposalSet(){
  const p={}; salesKeys.forEach(k=>p[k]=1+Math.floor(Math.random()*5)); return p;
}
function addStaff(name,level,time,skills,role=""){
  staff[name]={level,time,skills,role,proposal:proposalSet()};
}
function buildStaff(){
  staff={};
  const all=["PI","新規","機種変更","故障","プラン相談","光相談","その他","操作","簡易","支払い","他店在庫受取"];
  const lv2=["PI","新規","機種変更","プラン相談","光相談","その他","操作","簡易","支払い","他店在庫受取"];
  const lv1=["機種変更","プラン相談","光相談","その他","操作","簡易","支払い","他店在庫受取"];
  const newbie=["プラン相談","その他","操作","簡易","他店在庫受取"];
  const times=["安定◎","比較的安定","延長しやすい"];

  const regulars = dayMode==="weekday" ? ["スタッフA","スタッフB","スタッフC"] : ["スタッフA","スタッフB","スタッフC","スタッフD","スタッフE"];
  regulars.forEach((n,i)=>{
    const lv=[3,2,1,3,2][i%5];
    const sk=lv===3?all:(lv===2?lv2:lv1);
    addStaff(n,lv,times[i%3],sk);
  });
  addStaff("新人1","新人","延長しやすい",newbie);
  addStaff("新人2","新人","比較的安定",newbie);
  addStaff("店長",3,"安定◎",all,"空け");
  addStaff("副店長",3,"比較的安定",all,"相談者");
  addStaff("リーダー",3,"比較的安定",all,"フロア管理");
  addStaff("ヘルパー","H","比較的安定",["商談"],"商談");
}

let now=START,running=false,timer=null,score=0,rtScore=100,bossCount=0;
let sales={};salesKeys.forEach(k=>sales[k]=0);
const targets={"PLATINUM":2,"光":3,"GOLD":4,"アフィリエイト":5,"でんき・ガス":3};
let blocks=[],nextId=1,pending=[],selected=null;
let achievedTargets=new Set();

function fmt(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function slots(m){return Math.max(1,Math.ceil(m/15))}
function log(txt,cls=""){
  const eventEl=document.getElementById("eventLog");
  if(!eventEl)return;
  let auto=cls;
  if(!auto){
    if(txt.includes("来店"))auto="arrival";
    else if(txt.includes("キャンセル"))auto="cancel";
    else if(txt.includes("延長")||txt.includes("追加提案"))auto="alert";
    else if(txt.includes("確認")||txt.includes("移動")||txt.includes("相談"))auto="info";
  }
  eventEl.innerHTML=`<div class="logrow ${auto}"><b>${fmt(now)}</b>　${txt}</div>`+eventEl.innerHTML;
}
function renderGrid(){
 let h="<tr><th class='time'>時間</th>";lanes.forEach(l=>h+=`<th>${l}</th>`);h+="</tr>";
 for(let t=START;t<=END;t+=15){
   h+=`<tr data-time="${t}"><td class="time">${fmt(t)}</td>`;
   lanes.forEach(l=>h+=`<td data-lane="${l}" data-time="${t}"></td>`);
   h+="</tr>";
 }
 grid.innerHTML=h;
 document.querySelectorAll("#grid td[data-lane]").forEach(td=>{
   td.addEventListener("dragover",e=>e.preventDefault());
   td.addEventListener("drop",e=>{
     e.preventDefault();const id=Number(e.dataTransfer.getData("text/plain"));const b=blocks.find(x=>x.id===id);
     if(b)moveBlock(b,td.dataset.lane,Number(td.dataset.time));
   });
 });
}

const opportunityIcons={"PLATINUM":"💎","GOLD":"💳","光":"💡","でんき・ガス":"🔥","機種変更化":"📱","アフィリエイト":"👿"};

function makeOpportunities(type){
  // PIは全項目を狙える。
  if(type==="PI")return ["PLATINUM","GOLD","光","機種変更化","でんき・ガス","アフィリエイト"];
  // 予約内容ごとに「狙える実績」の出やすさを少し変える
  let probs={PLATINUM:.38,GOLD:.42,"光":.34};
  if(type==="PI"||type==="新規"||type==="機種変更"){
    probs={PLATINUM:.52,GOLD:.58,"光":.38};
  }else if(type==="プラン相談"){
    probs={PLATINUM:.46,GOLD:.50,"光":.48};
  }else if(type==="光相談"){
    probs={PLATINUM:.26,GOLD:.30,"光":.92};
  }else if(type==="故障"){
    probs={PLATINUM:.28,GOLD:.32,"光":.22};
  }else if(["操作","簡易","支払い"].includes(type)){
    probs={PLATINUM:.18,GOLD:.22,"光":.16};
  }else if(type==="休憩"||type==="延長"||type==="他店在庫受取"||type==="ご指摘対応"||type==="相談者"){
    return [];
  }
  let result=Object.keys(probs).filter(k=>Math.random()<probs[k]);
  // 下位実績・機種変更化の見込みも予約時点でランダム付与
  if(!["休憩","延長","他店在庫受取","ご指摘対応","相談者"].includes(type)){
    if(Math.random()<.38) result.push("でんき・ガス");
    if(Math.random()<.28) result.push("アフィリエイト");
    if(["プラン相談","故障","その他"].includes(type) && Math.random()<.38) result.push("機種変更化");
  }
  return [...new Set(result)];
}

function opportunityText(b){
  if(!b.opportunities || !b.opportunities.length) return "";
  return b.opportunities.map(k=>opportunityIcons[k]||"").join("");
}
function addBlock(lane,start,type,opt={}){
 const baseDuration=opt.duration??procedures[type]??15;
 const b={id:nextId++,lane,start,type,duration:baseDuration,state:opt.state||"white",locked:!!opt.locked,addressee:opt.addressee||null,source:opt.source||"予約",extended:0,check30Done:false,salesWon:[],salesTried:[],
   opportunities:opt.opportunities!==undefined?opt.opportunities:makeOpportunities(type),
   opportunitiesRevealed:opt.opportunitiesRevealed!==undefined?opt.opportunitiesRevealed:(opt.source!=="当日"),
   inspected:false,consulted:false,originalDuration:opt.originalDuration??baseDuration};
 blocks.push(b);renderBlocks();return b;
}
function stateClass(b){return b.addressee||b.locked?"st-pink":"st-"+b.state}
function renderBlocks(){
 document.querySelectorAll(".block").forEach(x=>x.remove());
 blocks.forEach(b=>{
   const cell=document.querySelector(`td[data-lane="${b.lane}"][data-time="${b.start}"]`);if(!cell)return;
   const d=document.createElement("div");d.className=`block ${stateClass(b)}`;d.dataset.id=b.id;
   d.style.height=(slots(b.duration)*CELL_H-4)+"px";
   const opp=opportunityText(b);
   const oppRow=(b.opportunitiesRevealed&&opp)?`<div class="sub">見込み：${opp}</div>`:"";
   const waitRow=(b.source==="当日"&&!b.inspected)?`<div class="sub">内容未確認</div>`:"";
   const consultRow=b.consulted?`<div class="sub">💬 相談済（見込み★+1）</div>`:"";
   const won=(b.salesWon&&b.salesWon.length)?`<div class="sub">成約：${b.salesWon.map(k=>k+" ♪").join("　")}</div>`:"";
   const canResize=!["休憩","延長","ご指摘対応","相談者"].includes(b.type) && !["当日","登録待ち","予備"].includes(b.lane);
   d.innerHTML=`<div class="title">${b.addressee?b.addressee+"宛｜":""}${b.type}</div><div class="sub">${fmt(b.start)}-${fmt(b.start+b.duration)}</div>${waitRow}${oppRow}${consultRow}${won}${canResize?'<div class="resizeHandle"></div>':''}`;
   bindBlock(d,b);cell.appendChild(d);
 });
 highlightNow();
}
function bindBlock(el,b){
 el.draggable=true;
 el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",String(b.id)));
 let timerPress=null,dragging=false,targetLane=null,targetTime=null;
 el.addEventListener("pointerdown",e=>{
   if(e.pointerType==="mouse")return;
   timerPress=setTimeout(()=>{dragging=true;el.setPointerCapture(e.pointerId);el.classList.add("dragghost")},450);
 });
 el.addEventListener("pointermove",e=>{
   if(!dragging)return;e.preventDefault();
   const t=document.elementFromPoint(e.clientX,e.clientY);const td=t&&t.closest("td[data-lane]");
   if(td){targetLane=td.dataset.lane;targetTime=Number(td.dataset.time);}
 });
 el.addEventListener("pointerup",e=>{
   clearTimeout(timerPress);
   if(dragging){dragging=false;el.classList.remove("dragghost");if(targetLane)moveBlock(b,targetLane,targetTime);return;}
   openModal(b);
 });
 el.addEventListener("click",e=>{if(e.target.closest(".resizeHandle"))return;if(window.matchMedia("(pointer:fine)").matches)openModal(b);});

 const handle=el.querySelector(".resizeHandle");
 if(handle){
   let resizing=false,startY=0,startDuration=0,lastSteps=0;
   handle.addEventListener("pointerdown",e=>{
     e.stopPropagation();e.preventDefault();
     resizing=true;startY=e.clientY;startDuration=b.duration;lastSteps=0;
     handle.setPointerCapture(e.pointerId);
   });
   handle.addEventListener("pointermove",e=>{
     if(!resizing)return;
     e.stopPropagation();e.preventDefault();
     const dy=e.clientY-startY;
     const steps=Math.round(dy/42);
     if(steps===lastSteps)return;
     lastSteps=steps;
     const minDur=15;
     const newDur=Math.max(minDur,startDuration+steps*15);
     setBlockDurationFromResize(b,newDur);
   });
   handle.addEventListener("pointerup",e=>{
     if(!resizing)return;
     resizing=false;e.stopPropagation();e.preventDefault();
     try{handle.releasePointerCapture(e.pointerId)}catch(_){}
   });
   handle.addEventListener("pointercancel",()=>{resizing=false});
 }

}
function canDo(lane,type,b){
 if(["当日","登録待ち","予備"].includes(lane))return true;
 if(type==="休憩")return lane!=="ヘルパー";
 if(lane==="ヘルパー")return true;
 if(b&&b.source==="ヘルパー登録")return lane!=="ヘルパー" && !["当日","登録待ち","予備"].includes(lane);
 return staff[lane]?.skills.includes(type);
}
function moveBlock(b,lane,start){
 if((b.locked||b.addressee)&&lane!==b.lane){log(`🔒 ${b.addressee||b.lane}宛は担当変更不可`,"bad");return;}
 if(!canDo(lane,b.type,b)){log(`❌ ${lane}は${b.type}対応不可`,"bad");return;}
 b.lane=lane;b.start=start;
 if(b.source==="当日" && !["当日","登録待ち","予備"].includes(lane) && b.requiredDuration){
   b.duration=b.requiredDuration + (b.inspected?1:0);
 }
 renderBlocks();log(`↔ ${b.type} → ${lane} ${fmt(start)}`,"");
}
function openModal(b){
 selected=b;const s=staff[b.lane];
 let h=`<h3>${b.addressee?b.addressee+"宛｜":""}${b.type}</h3><div class="small">${b.lane}｜${fmt(b.start)}〜${fmt(b.start+b.duration)}</div>`;
 if(s)h+=`<p><b>${b.lane}</b> Lv.${s.level}｜時間管理：${s.time}</p>`;
 if(b.opportunitiesRevealed){
   if(b.opportunities&&b.opportunities.length){
     h+=`<p><b>この予約の見込み：</b> ${b.opportunities.map(k=>(opportunityIcons[k]||"")+k).join("　")}</p>`;
   }else{
     h+=`<p class="small">この予約は実績見込み表示なし</p>`;
   }
 }else{

function makeWalkInWaveSchedule(){
  // 当日来店は必ず発生。午前・中盤・夕方へ分散。
  // 平日4〜6波、休日5〜7波。開始時刻は原則00/30。
  const count=dayMode==="weekday" ? 4+Math.floor(Math.random()*3) : 5+Math.floor(Math.random()*3);
  const buckets=[
    [630,765],   // 10:30-12:45
    [780,945],   // 13:00-15:45
    [960,1110]   // 16:00-18:30
  ];
  const times=[];
  for(let i=0;i<count;i++){
    const [a,b]=buckets[i%3];
    const candidates=[];
    for(let t=a;t<=b;t+=30)candidates.push(t);
    let t=candidates[Math.floor(Math.random()*candidates.length)];
    let guard=0;
    while(times.includes(t) && guard<20){
      t=candidates[Math.floor(Math.random()*candidates.length)];
      guard++;
    }
    times.push(t);
  }
  scheduledWalkInWaves=[...new Set(times)].sort((a,b)=>a-b);
}
function createWalkInWave(){
  // 1〜3名。2名以上もそこそこ発生。
  const roll=Math.random();
  const count=roll<.18?3:(roll<.58?2:1);
  const arrivals=[];
  for(let i=0;i<count;i++){
    let walkWeights=[
      {type:"支払い",w:8},
      {type:"機種変更",w:13},
      {type:"故障",w:21},
      {type:"プラン相談",w:20},
      {type:"その他",w:18},
      {type:"操作",w:7},
      {type:"簡易",w:5}
    ];
    if(dailyWalkInCounts.PI<1)walkWeights.push({type:"PI",w:2});
    if(dailyWalkInCounts["光相談"]<1)walkWeights.push({type:"光相談",w:3});

    const t=weightedChoice(walkWeights);
    if(t==="PI")dailyWalkInCounts.PI++;
    if(t==="光相談")dailyWalkInCounts["光相談"]++;

    const fullDur=procedures[t]||60;
    // 当日レーンでは15分カードで縦に並ぶ
    const b=addBlock("当日",now+i*15,t,{
      duration:15,state:"yellow",source:"当日",
      opportunities:makeOpportunities(t),opportunitiesRevealed:false
    });
    b.requiredDuration=fullDur;
    arrivals.push(t);
  }
  log(`🚶 当日来店：${arrivals.join("・")}（${arrivals.length}名）`,"arrival");
}

function weightedChoice(items){

  let r=Math.random()*total;
  for(const x of items){r-=x.w;if(r<=0)return x.type;}
  return items[items.length-1].type;
}
function randomProcFor(name){
  const s=staff[name];
  if(!s)return "その他";

  // 操作+簡易（30分）は合計最大約15%。

  const weights=[

function overlaps(lane,start,duration){

function freeFor(lane,start,duration){

}
function reserveBreaks(regulars){
  // 休憩は開始前から必ず60分確保。昼前後に分散。
  const starts=[690,720,750,780,810,840,870,900];
  regulars.forEach((n,i)=>{
    let preferred=starts[i%starts.length];
    let candidates=[preferred,preferred+15,preferred-15,preferred+30,preferred-30,preferred+45,preferred-45];
    let t=candidates.find(x=>freeFor(n,x,60));
    if(t===undefined){
      for(let x=660;x<=900;x+=15){ if(freeFor(n,x,60)){t=x;break;} }
    }
    if(t!==undefined)addBlock(n,t,"休憩",{state:"blue",source:"休憩"});
  });
}

function preferredStarts(ps,pe,dur){
  let normal=[],odd=[];
  for(let t=ps;t+dur<=pe;t+=15){
    if(t%30===0)normal.push(t);
    else odd.push(t);
  }
  // 基本は00/30開始。15/45開始は全店合計2件まで。
  return oddStartBudget>0 ? normal.concat(odd) : normal;
}
function fillBalancedReservations(name,targetRatio){
  // 10-13 / 13-16 / 16-19 を別々に埋め、空きを全時間帯へ散らす。
  const periods=[[START,780],[780,960],[960,END]];
  periods.forEach(([ps,pe])=>{
    const target=(pe-ps)*targetRatio;
    let occupied=blocks.filter(b=>b.lane===name && b.start<pe && b.start+b.duration>ps)
      .reduce((sum,b)=>sum+Math.max(0,Math.min(pe,b.start+b.duration)-Math.max(ps,b.start)),0);
    let attempts=0;
    while(occupied<target && attempts<120){
      attempts++;
      let proc=randomProcFor(name);
      let guard=0;
      while(!allowedInitialType(proc) && guard<20){proc=randomProcFor(name);guard++;}
      if(!allowedInitialType(proc)){attempts++;continue;}
      const dur=procedures[proc];
      const starts=preferredStarts(ps,pe,dur);
      let possible=starts.filter(t=>{
        if(!freeFor(name,t,dur))return false;
        // 10:00時点で通常スタッフ1名を必ず空ける。
        // そのスタッフは10:00〜10:30を初動用の余白にする。
        if(name===openingFloater && t<START+30 && t+dur>START)return false;
        return true;
      });
      if(!possible.length)break;

      // 00/30開始を優先し、15/45開始は1日2件以下。
      let normal=possible.filter(t=>t%30===0);
      let t;
      if(normal.length && (oddStartBudget<=0 || Math.random()<.94)){
        t=normal[Math.floor(Math.random()*normal.length)];
      }else{
        const odd=possible.filter(t=>t%30!==0);
        if(odd.length && oddStartBudget>0){
          t=odd[Math.floor(Math.random()*odd.length)];
          oddStartBudget--;
        }else if(normal.length){
          t=normal[Math.floor(Math.random()*normal.length)];
        }else break;
      }
      addBlock(name,t,proc,{state:"white",source:"予約"});
      noteInitialType(proc);
      occupied+=dur;
    }
  });
}
function ensureHelperCapacity(regulars){
  // ヘルパー終了後60分以内に、少なくとも1つ登録可能な空きがある商談だけ作る。
  const helperDeals=[
    {start:630,type:"新規",dealDur:60,regDur:90},
    {start:870,type:"光相談",dealDur:60,regDur:60},
    {start:1020,type:"機種変更",dealDur:60,regDur:90}
  ];
  helperDeals.forEach(d=>{
    const finish=d.start+d.dealDur;
    let hasSpace=false;
    for(const n of regulars){
      if(staff[n]?.level==="新人") continue;
      for(let t=finish;t<=finish+60;t+=15){
        if(freeFor(n,t,d.regDur)){hasSpace=true;break;}
      }
      if(hasSpace)break;
    }
    // 容量がなければ、該当時間帯の通常予約を1件だけ予備へ退避して余白を作る。
    if(!hasSpace){
      const candidates=blocks.filter(b=>
        regulars.includes(b.lane) &&
        staff[b.lane]?.level!=="新人" &&
        b.source==="予約" &&
        b.start>=finish && b.start<finish+75 &&
        !b.addressee
      );
      if(candidates.length){
        const victim=candidates.sort((a,b)=>b.duration-a.duration)[0];
        victim.lane="予備";
        log(`🧩 初期調整：ヘルパー登録余白を確保`,"");
      }
    }
    addBlock("ヘルパー",d.start,d.type,{duration:d.dealDur,state:"white",source:"ヘルパー商談"});
  });
}
function seed(){
  makeWalkInWaveSchedule();
  const regulars=lanes.filter(x=>x.startsWith("スタッフ")||x.startsWith("新人"));
  const normalStaff=regulars.filter(x=>x.startsWith("スタッフ"));

  // 10:00は通常スタッフのうち1人を必ず空ける
  openingFloater=normalStaff.length
    ? normalStaff[Math.floor(Math.random()*normalStaff.length)]
    : null;

  // 1. 休憩を先に確保
  reserveBreaks(regulars);
  // ヘルパー・リーダー・副店長・店長にも60分休憩を事前配置
  const managementBreaks=[
    ["リーダー",720],["ヘルパー",780],["副店長",840],["店長",900]
  ];
  managementBreaks.forEach(([n,t])=>{
    if(lanes.includes(n) && freeFor(n,t,60)){
      addBlock(n,t,"休憩",{state:"blue",source:"休憩",opportunities:[],opportunitiesRevealed:true});
    }
  });

  // 2. 予約密度：平日55〜60%、休日60〜65%
  const target=dayMode==="weekday" ? .575 : .625;
  regulars.forEach(n=>fillBalancedReservations(n,target));

  // 3. 宛予約は少数。空いている場所にのみ入れる。
  const candidates=regulars.filter(x=>staff[x]?.level!=="新人");
  const targetTimes=[615,930];
  candidates.slice(0,2).forEach((n,i)=>{
    const t=targetTimes[i];
    if(freeFor(n,t,90))addBlock(n,t,"機種変更",{locked:true,addressee:n,state:"white",source:"宛予約"});
  });

  // 4. ヘルパー案件。登録不能で開始しないよう最低限の余白を確認。
  ensureHelperCapacity(regulars);

  if(openingFloater){
    log(`🟢 10:00初動枠：${openingFloater} を10:30まで空けています`,"good");
  }
}

  dayMode=document.getElementById("dayModeSel").value;
  if(running) pauseGame();
  now=START; blocks=[]; nextId=1; pending=[]; score=0; rtScore=100; bossCount=0;
  oddStartBudget=2; dailyInitialCounts={PI:0,"光相談":0}; dailyWalkInCounts={PI:0,"光相談":0};
  scheduledWalkInWaves=[]; openingFloater=null; achievedTargets=new Set();
  sales={}; salesKeys.forEach(k=>sales[k]=0);
  buildLanes(); buildStaff(); renderGrid(); renderStaff(); seed(); renderSales(); updateScore(); highlightNow();
  log(dayMode==="weekday"?"📅 平日モードに変更":"📅 休日モードに変更","");
};
buildLanes();buildStaff();renderGrid();renderStaff();seed();renderSales();updateScore();highlightNow();log("準備完了。開始を押してください","");
